name: Project status

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

jobs:
  update-status:
    name: Update the task status
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Move the task on the project board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BRANCH: ${{ github.event_name == 'create' && github.event.ref || github.head_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          # Read the issue number from the branch name, e.g. chore/6-configure-the-root-layout
          if [[ ! "$BRANCH" =~ ^[a-z]+/([0-9]+)- ]]; then
            echo "Branch '$BRANCH' has no issue number. Nothing to update."
            exit 0
          fi
          ISSUE="${BASH_REMATCH[1]}"

          # Decide the new status from the event
          if [[ "$EVENT" == "create" ]]; then
            STATUS="In progress"
          elif [[ "$ACTION" == "closed" ]]; then
            if [[ "$MERGED" != "true" ]]; then
              echo "Pull request closed without merging. Nothing to update."
              exit 0
            fi
            STATUS="Complete"
          elif [[ "$DRAFT" == "true" ]]; then
            STATUS="In progress"
          else
            STATUS="In review"
          fi
          echo "Issue #$ISSUE → $STATUS"

          # Find the project, its Status field and the option for the new status
          read -r PROJECT_ID FIELD_ID OPTION_ID < <(gh api graphql \
            -f query='query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' \
            -f org="$ORG" -F number="$PROJECT_NUMBER" \
            --jq ".data.organization.projectV2 | [.id, .field.id, (.field.options[] | select(.name == \"$STATUS\") | .id)] | @tsv")

          if [[ -z "${OPTION_ID:-}" ]]; then
            echo "::error::The Status field has no option named '$STATUS'."
            exit 1
          fi

          # Find the issue's item on this project
          ITEM_ID=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  projectItems(first: 20) { nodes { id project { id } } }
                }
              }
            }' \
            -f owner="$ORG" -f repo="$REPO" -F number="$ISSUE" \
            --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" || true)

          if [[ -z "$ITEM_ID" ]]; then
            echo "Issue #$ISSUE is not on the project board. Nothing to update."
            exit 0
          fi

          # Update the status
          gh api graphql \
            -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID" \
            > /dev/null

          # Close the issue once its pull request is merged, including stacked pull requests
          if [[ "$STATUS" == "Complete" ]]; then
            gh issue close "$ISSUE" --repo "$ORG/$REPO" --reason completed || true
          fi
