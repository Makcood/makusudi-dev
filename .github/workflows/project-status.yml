name: Project status

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

jobs:
  update-status:
    name: Update the task and epic status
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Move the task and its epic on the project board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BRANCH: ${{ github.event_name == 'create' && github.event.ref || github.head_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          # Read the task number from the branch name, e.g. chore/6-configure-the-root-layout
          if [[ ! "$BRANCH" =~ ^[a-z]+/([0-9]+)- ]]; then
            echo "Branch '$BRANCH' has no task number. Nothing to update."
            exit 0
          fi
          TASK="${BASH_REMATCH[1]}"

          # Load the project, its Status field and the status options
          PROJECT=$(gh api graphql \
            -f query='query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' \
            -f org="$ORG" -F number="$PROJECT_NUMBER" --jq '.data.organization.projectV2')
          PROJECT_ID=$(jq -r '.id' <<< "$PROJECT")
          FIELD_ID=$(jq -r '.field.id' <<< "$PROJECT")

          # Set the status of an issue, if the issue is on the board
          set_status() {
            local number="$1" status="$2" option item
            option=$(jq -r --arg s "$status" '.field.options[] | select(.name == $s) | .id' <<< "$PROJECT")
            if [[ -z "$option" ]]; then
              echo "::error::The Status field has no option named '$status'."
              exit 1
            fi
            item=$(gh api graphql \
              -f query='query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { projectItems(first: 20) { nodes { id project { id } } } }
                }
              }' \
              -f owner="$ORG" -f repo="$REPO" -F number="$number" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" || true)
            if [[ -z "$item" ]]; then
              echo "#$number is not on the board. Skipped."
              return
            fi
            gh api graphql \
              -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }' \
              -f project="$PROJECT_ID" -f item="$item" -f field="$FIELD_ID" -f option="$option" > /dev/null
            echo "#$number → $status"
          }

          # Load the task's parent epic and its progress
          load_epic() {
            gh api graphql \
              -f query='query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    parent { number subIssuesSummary { total completed } }
                  }
                }
              }' \
              -f owner="$ORG" -f repo="$REPO" -F number="$TASK" \
              --jq '.data.repository.issue.parent // empty' || true
          }

          if [[ "$EVENT" == "create" ]] || [[ "$DRAFT" == "true" && "$ACTION" != "closed" ]]; then
            # Work started on the task
            set_status "$TASK" "In progress"
            EPIC=$(load_epic)
            if [[ -n "$EPIC" ]]; then
              set_status "$(jq -r '.number' <<< "$EPIC")" "In progress"
            fi

          elif [[ "$ACTION" == "closed" ]]; then
            if [[ "$MERGED" != "true" ]]; then
              echo "Pull request closed without merging. Nothing to update."
              exit 0
            fi
            # Task finished: close it, then complete the epic when all its tasks are closed
            set_status "$TASK" "Complete"
            gh issue close "$TASK" --repo "$ORG/$REPO" --reason completed || true
            sleep 5
            EPIC=$(load_epic)
            if [[ -n "$EPIC" ]]; then
              EPIC_NUMBER=$(jq -r '.number' <<< "$EPIC")
              if [[ $(jq '.subIssuesSummary.completed == .subIssuesSummary.total' <<< "$EPIC") == "true" ]]; then
                set_status "$EPIC_NUMBER" "Complete"
                gh issue close "$EPIC_NUMBER" --repo "$ORG/$REPO" --reason completed || true
              else
                set_status "$EPIC_NUMBER" "In progress"
              fi
            fi

          else
            # Pull request ready for review: the epic is in review when this is its last open task
            set_status "$TASK" "In review"
            EPIC=$(load_epic)
            if [[ -n "$EPIC" ]]; then
              EPIC_NUMBER=$(jq -r '.number' <<< "$EPIC")
              if [[ $(jq '.subIssuesSummary.completed + 1 >= .subIssuesSummary.total' <<< "$EPIC") == "true" ]]; then
                set_status "$EPIC_NUMBER" "In review"
              else
                set_status "$EPIC_NUMBER" "In progress"
              fi
            fi
          fi
