name: Milestone
description: A release checkpoint that groups epics into one goal
type: Milestone
body:
  - type: markdown
    attributes:
      value: |
        Define the release goal and its scope. Once created, add each epic as a sub-issue of this milestone.

  - type: textarea
    id: goal
    attributes:
      label: GOAL
      description: The single outcome this milestone delivers, in one or two sentences.
      value: "> "
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: SCOPE
      description: The areas of work this release brings together.
      value: "> "
    validations:
      required: true

  - type: textarea
    id: release-criteria
    attributes:
      label: RELEASE CRITERIA
      description: What must be true before this milestone is closed.
      value: |
        > - [ ] All sub-issues are closed
        > - [ ] The project builds and deploys without errors or warnings
        > - [ ] The release is tagged and its notes are published
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: NOTES
      description: |
        Optional. Add an alert only if the content needs one: `[!NOTE]`, `[!TIP]`, `[!IMPORTANT]`, `[!WARNING]` or `[!CAUTION]`.
      placeholder: |
        > [!IMPORTANT]
        > Deployment depends on the domain being registered.
